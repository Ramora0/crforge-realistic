<!doctype html>
<!--
  crforge - https://github.com/voonhous/crforge
  SPDX-License-Identifier: Apache-2.0
  The phone server's page (docs/phone-server.md): draws the frames the server streams (as draw
  lists, with WebGL, or as JPEG), sends the player's taps, and plays the battle's sounds with Web
  Audio. No build step: plain JS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="crforge">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>crforge</title>
<style>
  :root { --fg: #f4f1e8; --bg: #000; --panel: rgba(16, 22, 34, 0.92); --accent: #f6c344; --bad: #e0574c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { position: fixed; inset: 0; touch-action: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display: block; touch-action: none; background: #0d1210; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); z-index: 10; padding: 16px; box-sizing: border-box; }
  .overlay.on { display: flex; }
  .card { background: var(--panel); border-radius: 14px; padding: 18px 18px 14px; width: min(92vw, 380px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  p { margin: 6px 0; }
  .muted { opacity: 0.7; font-size: 13px; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; opacity: 0.85; }
  select { width: 100%; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #445;
    background: #1d2433; color: var(--fg); }
  button { font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--accent); color: #241a00; width: 100%; margin-top: 12px; touch-action: manipulation; }
  button.secondary { background: #2c3650; color: var(--fg); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  /* top centre: the HUD's opponent name is at the top left and its clock at the top right */
  #hud { position: absolute; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 6px; }
  #hud button { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; background: rgba(20, 26, 40, 0.75); color: var(--fg); }
  #toast { position: absolute; left: 50%; bottom: 24%; transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: rgba(0, 0, 0, 0.75); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: opacity 0.2s; max-width: 80vw; text-align: center; }
  #toast.on { opacity: 1; }
  #stats { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 44px); z-index: 5; font: 11px/1.3 ui-monospace, Menlo, monospace;
    background: rgba(0, 0, 0, 0.6); padding: 4px 6px; border-radius: 6px; display: none; white-space: pre; pointer-events: none; }
  #banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; z-index: 4; pointer-events: none;
    font-size: 20px; font-weight: 700; text-shadow: 0 2px 6px #000; display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="720" height="1560"></canvas><canvas id="gl" width="720" height="1560" style="display:none"></canvas></div>
<div id="hud"><button id="soundBtn">Sound on</button><button id="menuBtn">Menu</button></div>
<div id="stats"></div>
<div id="banner"></div>
<div id="toast"></div>

<div class="overlay on" id="startScreen"><div class="card">
  <h1>crforge</h1>
  <p class="muted" id="startInfo">Connecting...</p>
  <button id="startBtn" disabled>Tap to play</button>
  <p class="muted">The sound starts with this tap. Drag a card onto the arena, or tap a card then tap where it goes.</p>
</div></div>

<div class="overlay" id="menu"><div class="card">
  <h2>New battle</h2>
  <label for="optOpponent">Opponent</label>
  <select id="optOpponent"><option value="bot">Bot</option><option value="friend">A friend on another phone</option></select>
  <label for="optDeck">Your deck</label><select id="optDeck"></select>
  <label for="optOppDeck">Opponent's deck</label><select id="optOppDeck"></select>
  <label for="optLocation">Arena</label><select id="optLocation"></select>
  <button id="newBtn">Start new battle</button>
  <label for="optPicture">Picture (applies now)</label>
  <select id="optPicture">
    <option value="draw">Drawn on this phone: sharp, under 1 Mbit/s</option>
    <option value="high">Video, sharp: fast home Wi-Fi</option>
    <option value="medium">Video, balanced: tunnel, good network</option>
    <option value="low">Video, light: phone network, slow tunnel</option>
  </select>
  <div id="modelsRow"><label for="optModels">3D units, drawn on this phone</label>
  <select id="optModels">
    <option value="3d">As 3D models (the default)</option>
    <option value="2d">As their 2D stand-in</option>
  </select></div>
  <div class="row"><button class="secondary" id="statsBtn">Stats</button><button class="secondary" id="closeMenu">Close</button></div>
  <p class="muted" id="menuInfo"></p>
</div></div>

<div class="overlay" id="endScreen"><div class="card">
  <h2 id="endTitle">Battle over</h2>
  <button id="rematchBtn">Play again</button>
  <button class="secondary" id="endMenuBtn">Change battle</button>
</div></div>

<div class="overlay" id="lost"><div class="card">
  <h2>Connection lost</h2>
  <p class="muted" id="lostInfo">Reconnecting...</p>
  <button id="reconnectBtn">Reconnect</button>
</div></div>

<script>
"use strict";
// The 3D models drawn on the phone (docs/phone-server.md, "3D models on the phone"). The server
// keeps the battle and the models' state machines; each frame's draw list carries, at its place
// in the draw order, a model draw: the model refs of its parts, each part's clip, time and
// cross-fade, where it stands and how it is turned and coloured (DrawCodec.java's model section).
// This samples the clips, poses the skeletons, skins them on the GPU and shades them with the
// game's uber_pbr (the server's port, UberPbr.java, here in GLSL ES 3.00), each model rendered
// into a region of one image (an atlas) as the server renders each into its own, then drawn by
// the draw-list player as the server's batch draws that image. Model files come over HTTP
// (ModelAssets.java's binary, PNG textures), cached by content.
window.crforge3d = (() => {
  let gl = null, ok = false, query = "";
  const refs = new Map();       // ref id -> { asset, transform: Float32Array(16), shadow, skip: Set }
  const assets = new Map();     // asset id -> { ready, failed, model, promise }
  const textures = new Map();   // texture id -> { tex, ready, promise }
  let scene = null, scenePromise = null;
  let lit = null, shadowProg = null, LU = {}, SU = {};
  let fbo = null, atlas = null, depth = null, AW = 2048, AH = 2048;
  let jointTex = null, jointRows = 0;
  const JOINTS_MAX = 256;
  let defaults = null;
  let SIN = Math.sin(36.8 * Math.PI / 180), COS = Math.cos(36.8 * Math.PI / 180);
  const stats = { modelMB: 0, textureMB: 0, models: 0, ms: 0, drawn: 0, waiting: 0, scale: 0 };
  const debug = {};

  // ---------------------------------------------------------------- shaders (UberPbr.java)
  const SKIN = `
    in vec3 a_position; in vec3 a_normal; in vec4 a_tangent; in vec2 a_texCoord0; in vec4 a_joints; in vec4 a_weights;
    uniform mat4 u_mvp; uniform mat4 u_part; uniform bool u_skinned; uniform int u_row; uniform highp sampler2D u_jointTex;
    mat4 joint(float j) { int x = int(j + 0.5) * 4;
      return mat4(texelFetch(u_jointTex, ivec2(x, u_row), 0), texelFetch(u_jointTex, ivec2(x + 1, u_row), 0),
                  texelFetch(u_jointTex, ivec2(x + 2, u_row), 0), texelFetch(u_jointTex, ivec2(x + 3, u_row), 0)); }
    mat4 placement() {
      if (!u_skinned) return u_part;
      mat4 s = mat4(0.0);
      if (a_weights.x > 0.0) s += a_weights.x * joint(a_joints.x);
      if (a_weights.y > 0.0) s += a_weights.y * joint(a_joints.y);
      if (a_weights.z > 0.0) s += a_weights.z * joint(a_joints.z);
      if (a_weights.w > 0.0) s += a_weights.w * joint(a_joints.w);
      return u_part * s;
    }`;
  const LIT_VS = `#version 300 es
    precision highp float; precision highp int;` + SKIN + `
    out vec3 v_worldPos; out vec3 v_worldNormal; out vec4 v_tangent; out vec2 v_texCoord;
    void main() {
      mat4 m = placement();
      vec4 p = m * vec4(a_position, 1.0);
      v_worldPos = p.xyz;
      v_worldNormal = normalize(mat3(m) * a_normal);
      v_tangent = vec4(normalize(mat3(m) * a_tangent.xyz), a_tangent.w);
      v_texCoord = a_texCoord0;
      gl_Position = u_mvp * p;
    }`;
  const LIT_FS = `#version 300 es
    precision highp float; precision highp int;
    uniform sampler2D mraTex; uniform sampler2D normalTex; uniform sampler2D diffuseTex;
    uniform sampler2D teamColorTex; uniform sampler2D reflectioinTex;
    uniform float metalness; uniform float roughness; uniform float emissiveStrength;
    uniform vec4 u_lightDirectionTime; uniform vec4 u_cameraPosition; uniform vec4 u_dirLightColor;
    uniform vec4 u_sceneAmbientColor; uniform vec4 u_color; uniform vec4 u_clipPlane;
    uniform vec4 color_mul; uniform vec4 color_add;
    uniform vec4 u_fresnel; uniform float u_fresnelIor; uniform vec4 u_rim; uniform vec3 u_rimParams; uniform vec3 u_rimDir;
    in vec3 v_worldPos; in vec3 v_worldNormal; in vec4 v_tangent; in vec2 v_texCoord;
    out vec4 fragColor;
    vec3 toLinear(vec3 c) {
      vec3 lo = c / 12.92;
      vec3 hi = pow((c + 0.055) / 1.055, vec3(2.4));
      return mix(hi, lo, vec3(lessThanEqual(c, vec3(0.04045))));
    }
    void main() {
      vec4 orm = texture(mraTex, v_texCoord);
      float metal = clamp(metalness * orm.b, 0.0, 1.0);
      float rough = clamp(roughness * orm.g, 0.0, 1.0);
      float ao = orm.r;
      vec3 V = normalize(u_cameraPosition.xyz - v_worldPos);
      vec2 nxy = texture(normalTex, v_texCoord).xy * 2.0 - vec2(1.0);
      float nz2 = 1.0 - dot(nxy, nxy);
      float nz = nz2 > 0.0 ? sqrt(nz2) : 0.0;
      vec3 N = normalize(v_tangent.xyz * nxy.x
          + cross(v_worldNormal, v_tangent.xyz) * v_tangent.w * nxy.y + v_worldNormal * nz);
      vec3 L = u_lightDirectionTime.xyz;
      float NdL = max(dot(N, L), 0.0);
      float NdH = max(dot(N, normalize(V + L)), 0.0);
      float NdV = max(dot(V, N), 0.0);
      vec4 diff = texture(diffuseTex, v_texCoord);
      vec3 base = toLinear(diff.rgb);
      float alpha = diff.a;
      vec4 team = texture(teamColorTex, v_texCoord);
      vec3 albedo = mix(base, base * u_color.rgb, vec3(team.z));
      vec3 F0 = mix(vec3(0.04), albedo, vec3(metal));
      float r2 = rough * rough;
      float a2 = r2 * r2;
      float d = ((NdH * a2) - NdH) * NdH + 1.0;
      float D = a2 / ((3.1415925 * d) * d);
      float rk = max(rough, 0.0001);
      float k = (rk * rk) * 0.7978846;
      float gl = NdL / max(NdL * (1.0 - k) + k, 0.0001);
      float gv = NdV / max(NdV * (1.0 - k) + k, 0.0001);
      float om = 1.0 - rough;
      float f5 = 1.0 - NdV;
      f5 = f5 * f5 * f5 * f5 * f5;
      vec3 F = F0 + (vec3(clamp(om, 0.0, F0.x), clamp(om, 0.0, F0.y), clamp(om, 0.0, F0.z)) - F0) * f5;
      vec3 kD = vec3(1.0) - F;
      float kM = 1.0 - metal;
      vec3 R = reflect(V, N);
      vec2 ruv = vec2(
          clamp(1.0 - ((atan(R.y, -R.x) + 3.1415925) * 0.15915495), 0.0, 1.0),
          clamp((atan(R.z, sqrt(R.x * R.x + R.y * R.y)) + 1.5707963) * 0.31830990, 0.0, 1.0));
      float lod = clamp(rough * 4.0, 0.0, 3.99) * 3.33;
      vec3 refl = textureLod(reflectioinTex, ruv, lod).xyz;
      vec3 c = ((albedo * kD * kM + F * (((team.x * (gl * gv)) * D) / ((4.0 * NdV) * NdL + 0.0001)))
              * NdL) * (u_dirLightColor.xyz * ao)
          + (u_sceneAmbientColor.xyz * ao) * albedo * kD * kM
          + ((refl * (team.x * ao)) * F) * u_sceneAmbientColor.w;
      c = mix(c, albedo * emissiveStrength, vec3(team.y));
      if (u_fresnel.w >= 0.0) {
        float cth = abs(NdV);
        float g2 = u_fresnelIor * u_fresnelIor - 1.0 + cth * cth;
        float fr = 1.0;
        if (g2 > 0.0) {
          float g = sqrt(g2);
          float gm = g - cth;
          float gp = g + cth;
          float q = gm / gp;
          float q2 = (cth * gp - 1.0) / (cth * gm + 1.0);
          fr = 0.5 * q * q * (1.0 + q2 * q2);
        }
        float fw = fr * u_fresnel.w;
        c = mix(c, u_fresnel.xyz, vec3(fw));
        alpha = clamp(alpha + fw, 0.05, 1.0);
      }
      if (u_rim.w != 0.0) {
        float rd = length(u_rimDir);
        float facing = rd > 0.0001 ? max(dot(u_rimDir / rd, N), 0.0) : 0.0;
        c += u_rim.xyz * (pow(smoothstep(u_rimParams.y, 1.0, (1.0 - NdV) * (1.0 - facing)),
            u_rimParams.x) * ((u_rim.w * team.x) * ao));
      }
      if (v_worldPos.z < u_clipPlane.w) discard;
      float a = alpha * color_mul.w;
      vec3 s1 = sqrt(max(c * color_mul.xyz + color_add.xyz, vec3(0.0)));
      vec3 s2 = sqrt(s1);
      vec3 outc = s1 * 0.5851224 + s2 * 0.7831404 - sqrt(s2) * 0.3682627;
      fragColor = vec4(clamp(outc, 0.0, 1.0) * a, a);
    }`;
  const SHADOW_VS = `#version 300 es
    precision highp float; precision highp int;` + SKIN + `
    uniform vec4 u_lightDirectionTime;
    out float v_z;
    void main() {
      vec4 p4 = placement() * vec4(a_position, 1.0);
      vec3 p = p4.xyz;
      vec3 q = abs(u_lightDirectionTime.z) < 0.001 ? p
          : p - u_lightDirectionTime.xyz * (p.z / u_lightDirectionTime.z);
      v_z = p.z;
      gl_Position = u_mvp * vec4(q.xy, 0.0, 1.0);
    }`;
  const SHADOW_FS = `#version 300 es
    precision highp float;
    uniform vec4 u_clipPlane; in float v_z; out vec4 fragColor;
    void main() { float s = step(u_clipPlane.w, v_z); fragColor = vec4(s, 0.0, 0.0, s); }`;

  // the effect shaders (FxShaders.java), the billboard placement on the GPU (FxRenderer.place)
  const FX_VS = `#version 300 es
    precision highp float;
    in vec3 a_position; in vec3 a_normal; in vec2 a_texCoord0;
    uniform mat4 u_mvp; uniform mat4 u_full; uniform bool u_billboard; uniform mat3 u_basis;
    out vec3 v_worldPos; out vec3 v_worldNormal; out vec2 v_texCoord;
    void main() {
      vec3 q, n;
      mat3 lin = mat3(u_full);
      if (u_billboard) {
        q = u_full[3].xyz + u_basis * (lin * a_position);
        vec3 ln = lin * a_normal;
        n = u_basis * (dot(ln, ln) > 0.0 ? normalize(ln) : ln);
      } else {
        q = (u_full * vec4(a_position, 1.0)).xyz;
        vec3 ln = lin * a_normal;
        n = dot(ln, ln) > 0.0 ? normalize(ln) : ln;
      }
      v_worldPos = q; v_worldNormal = n; v_texCoord = a_texCoord0;
      gl_Position = u_mvp * vec4(q, 1.0);
    }`;
  const MASK_FS = `#version 300 es
    precision highp float;
    uniform sampler2D mainTex; uniform sampler2D maskTex; uniform sampler2D maskTex2; uniform sampler2D distortionTex; uniform sampler2D dissolveTex;
    uniform vec4 u_v[10];
    uniform vec2 disv_speedxy; uniform vec2 main_speedxy; uniform float disv_amount; uniform float disv_edge_hardness;
    uniform float u_time; uniform vec4 u_defines; uniform float u_mask2; uniform float u_additive; uniform float u_alphaMul;
    in vec2 v_texCoord; out vec4 fragColor;
    void main() {
      vec4 mainTex_UV = u_v[0], maskTex_UV = u_v[1], mask_speedxy_pow_mul = u_v[2], mask_rgba_selector = u_v[3],
        distortionTex_UV = u_v[4], dist_speedxy_wmain_wmask = u_v[5], dist_rgba_selector = u_v[6], dissolveTex_UV = u_v[7],
        disv_rgba_selector = u_v[8], mainColor = u_v[9];
      float dist = 0.0;
      if (u_defines.x > 0.5) {
        dist = dot(texture(distortionTex, v_texCoord * distortionTex_UV.xy + distortionTex_UV.zw
            + dist_speedxy_wmain_wmask.xy * u_time), dist_rgba_selector);
      }
      vec2 muv = v_texCoord * mainTex_UV.xy + mainTex_UV.zw + main_speedxy * u_time + vec2(dist * dist_speedxy_wmain_wmask.z);
      vec4 col = mainColor;
      if (u_defines.z > 0.5) col.w = col.w * texture(mainTex, muv).x;
      else col = texture(mainTex, muv) * mainColor;
      vec2 kuv = v_texCoord * maskTex_UV.xy + maskTex_UV.zw + mask_speedxy_pow_mul.xy * u_time + vec2(dist * dist_speedxy_wmain_wmask.w);
      float m = dot(texture(maskTex, kuv), mask_rgba_selector);
      if (u_mask2 < 0.5) m = max(m, 0.001);
      col.w = col.w * clamp(pow(m, mask_speedxy_pow_mul.z) * mask_speedxy_pow_mul.w, 0.0, 1.0);
      if (u_defines.y > 0.5) {
        float d = dot(texture(dissolveTex, v_texCoord * dissolveTex_UV.xy + dissolveTex_UV.zw + disv_speedxy * u_time), disv_rgba_selector);
        float s = smoothstep(disv_edge_hardness, 1.0 - disv_edge_hardness, clamp(d + 1.0 - disv_amount * 2.0, 0.0, 1.0));
        if (u_defines.w > 0.5) s = mix(s, 1.0, texture(maskTex2, v_texCoord).x);
        col.w = col.w * s;
      }
      float a = max(col.w * u_alphaMul, 0.0);
      if (u_additive < 0.5) a = min(a, 1.0);
      vec3 rgb = max(col.xyz, vec3(0.0)) * a;
      fragColor = vec4(rgb, u_additive > 0.5 ? 0.0 : a);
    }`;
  const FRESNEL_FS = `#version 300 es
    precision highp float;
    uniform vec4 mainColor; uniform vec4 fnl_color; uniform float fnl_power; uniform float fnl_int;
    uniform vec4 u_cameraPosition; uniform float u_additive; uniform float u_alphaMul;
    in vec3 v_worldPos; in vec3 v_worldNormal; in vec2 v_texCoord; out vec4 fragColor;
    vec3 lin(vec3 c) { return c * 0.012522878 + c * 0.6821711 * c + c * 0.305306 * c * c; }
    void main() {
      vec3 V = normalize(u_cameraPosition.xyz - v_worldPos);
      float f = exp2(fnl_power * log2(max(1.0 - max(dot(normalize(v_worldNormal), V), 0.0), 0.0001))) * fnl_int;
      vec3 s1 = sqrt(max(lin(mainColor.xyz) + lin(fnl_color.xyz) * f, vec3(0.0)));
      vec3 s2 = sqrt(s1);
      vec3 c = s1 * 0.5851224 + s2 * 0.7831404 - sqrt(s2) * 0.3682627;
      float a = clamp(fnl_color.w * u_alphaMul, 0.0, 1.0);
      fragColor = vec4(max(c, vec3(0.0)) * a, u_additive > 0.5 ? 0.0 : a);
    }`;
  let maskProg = null, MU = {}, fresProg = null, FU = {};

  function program(vs, fs, names) {
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    ["a_position", "a_normal", "a_tangent", "a_texCoord0", "a_joints", "a_weights"].forEach((n, i) => gl.bindAttribLocation(p, i, n));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const U = {};
    for (const n of names) U[n] = gl.getUniformLocation(p, n);
    return [p, U];
  }

  function solid(rgba) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(rgba));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    return t;
  }

  // Compiles the shaders and makes the atlas (WebGL 2 only): at page load, so a battle does not
  // wait for them. Returns whether models can be drawn.
  function init(context, q) {
    gl = context; query = q || ""; ok = false;
    if (!(typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext)) return false;
    try {
      [lit, LU] = program(LIT_VS, LIT_FS, ["u_mvp", "u_part", "u_skinned", "u_row", "u_jointTex", "mraTex", "normalTex", "diffuseTex",
        "teamColorTex", "reflectioinTex", "metalness", "roughness", "emissiveStrength", "u_lightDirectionTime", "u_cameraPosition",

        `${M.stats.models} models ${(M.stats.modelMB + M.stats.textureMB).toFixed(1)} MB, waiting ${M.stats.waiting}; ` : "") : "";
    send({ type: "tele", s:
      `[${stats.mode || "?"}] recv ${(tele.recv / dt).toFixed(1)} fps ${(tele.kb * 8 / 1024 / dt).toFixed(2)} Mbit/s; ` + list +
      `decode ${(tele.dec / Math.max(1, tele.recv)).toFixed(1)} ms avg ${tele.decMax.toFixed(0)} max; ` +
      `dropped before decode ${tele.dropped}; shown ${(tele.shown / dt).toFixed(1)} fps, longest gap ${tele.gapMax.toFixed(0)} ms; ` +
      `latest arrival +${tele.lateMax.toFixed(0)} ms; buffer ${playout.margin.toFixed(0)} ms; ` +
      `screen ${screen.width}x${screen.height}@${devicePixelRatio} ${navigator.userAgent.match(/OS [0-9_]+|Version\/[0-9.]+/g)}` });
    Object.assign(tele, { recv: 0, kb: 0, dec: 0, decMax: 0, dropped: 0, shown: 0, gapMax: 0, lateMax: 0, t0: performance.now(),
      listKb: 0, listMax: 0, polys: 0, drawMs: 0, drawMax: 0, drawn: 0, patchKb: 0, missing: 0, models: 0, modelMs: 0, modelMax: 0 });
    if (M) M.stats.waiting = 0;
  }, 2000);
  function onFrame(buf) {
    const now = performance.now();
    const dv = new DataView(buf);
    const type = dv.getUint8(0);
    if (type === 3) {
      // a texture patch: uploaded as soon as its image is decoded
      tele.kb += buf.byteLength / 1024; tele.patchKb += buf.byteLength / 1024;
      if (waitArt) $("startInfo").textContent = "Loading the art: " + (D.stats.patchBytes / 1048576 + buf.byteLength / 1048576).toFixed(1) + " MB";
      if (canDraw()) D.patch(buf);
      return;
    }
    if (type === 2) { onList(buf, dv, now); return; }
    playout.waiting.push({ buf, cap: dv.getUint32(16), got: now });
    // a phone that cannot decode as fast as frames arrive skips the oldest
    while (playout.waiting.length > 3) { ack(playout.waiting.shift().buf); tele.dropped++; }
    if (!playout.decoding) decodeNext();
  }
  function ack(buf) { send({ type: "ack", f: new DataView(buf).getInt32(1) }); }
  async function decodeNext() {
    const item = playout.waiting.shift();
    if (!item) { playout.decoding = false; return; }
    playout.decoding = true;
    const buf = item.buf, dv = new DataView(buf);
    const input = dv.getInt32(9);
    stats.enc = dv.getInt16(13) / 10; stats.q = dv.getUint8(15);
    const blob = new Blob([new Uint8Array(buf, HEADER)], { type: "image/jpeg" });
    let bmp = null;
    const d0 = performance.now();
    try {
      if (window.createImageBitmap) bmp = await createImageBitmap(blob);
      else bmp = await new Promise((ok, fail) => {
        const img = new Image(), url = URL.createObjectURL(blob);
        img.onload = () => { URL.revokeObjectURL(url); ok(img); };
        img.onerror = fail; img.src = url;
      });
    } catch (e) { /* a bad frame: the next one replaces it */ }
    ack(buf);
    const dms = performance.now() - d0;
    tele.recv++; tele.kb += buf.byteLength / 1024; tele.dec += dms; tele.decMax = Math.max(tele.decMax, dms);
    stats.bytes += buf.byteLength; stats.recv++;
    if (bmp) {
      track(item.got, item.got - item.cap);
      if (playout.lat.length) {
        let base = Infinity; for (const x of playout.lat) base = Math.min(base, x[1]);
        tele.lateMax = Math.max(tele.lateMax, item.got - item.cap - base);
      }
      playout.ready.push({ bmp, cap: item.cap, input });
      // a backlog (the page was hidden, or the delay just dropped): keep the newest few
      while (playout.ready.length > 12) release(playout.ready.shift());
    }
    decodeNext();
  }
  function release(f) { if (f && f.bmp && f.bmp.close) f.bmp.close(); }
  // A draw-list frame: each is coded against the one before, so every one is decoded, in order.
  let listChain = Promise.resolve();
  function onList(buf, dv, got) {
    const cap = dv.getUint32(16), input = dv.getInt32(9);
    stats.enc = dv.getInt16(13) / 10;
    listChain = listChain.then(async () => {
      const d0 = performance.now();
      let f = null;
      try { if (canDraw()) f = await D.decode(new Uint8Array(buf, HEADER)); } catch (e) { console.warn("draw list", e); }
      ack(buf);
      const dms = performance.now() - d0;
      const kb = buf.byteLength / 1024;
      tele.recv++; tele.kb += kb; tele.dec += dms; tele.decMax = Math.max(tele.decMax, dms);
      tele.listKb += kb; tele.listMax = Math.max(tele.listMax, kb);
      stats.bytes += buf.byteLength; stats.recv++;
      if (!f) return;
      tele.polys += f.count;
      track(got, got - cap);
      if (playout.lat.length) {
        let base = Infinity; for (const x of playout.lat) base = Math.min(base, x[1]);
        tele.lateMax = Math.max(tele.lateMax, got - cap - base);
      }
      playout.ready.push({ dl: f, cap, input });
      while (playout.ready.length > 12) playout.ready.shift();
    });
  }
  function track(now, lat) {
    const L = playout.lat;
    L.push([now, lat]);
    while (L.length && now - L[0][0] > 4000) L.shift();
    let base = Infinity;
    for (const x of L) base = Math.min(base, x[1]);
    const late = L.map((x) => x[1] - base).sort((p, q) => p - q);
    const jitter = late[Math.min(late.length - 1, Math.floor(late.length * 0.97))];
    const margin = Math.min(300, Math.max(25, jitter + 10));
    const target = base + margin;
    if (playout.delay == null || Math.abs(target - playout.delay) > 1000) playout.delay = target;
    // grow quickly (a late frame is a visible stall), shrink slowly (no visible speed-up)
    else if (target > playout.delay) playout.delay += (target - playout.delay) * 0.25;
    else playout.delay += (target - playout.delay) * 0.01;
    playout.margin = playout.delay - base;
  }
  let shown = null;
  function present() {
    requestAnimationFrame(present);
    if (playout.delay == null || !playout.ready.length) return;
    const due = performance.now() - playout.delay;
    let pick = -1;
    for (let i = 0; i < playout.ready.length; i++) if (playout.ready[i].cap <= due) pick = i;
    if (pick < 0) return;
    for (let i = 0; i < pick; i++) release(playout.ready[i]);
    const f = playout.ready[pick];
    playout.ready.splice(0, pick + 1);
    if (f.dl) {
      show(glCanvas);
      const r = D.draw(f.dl, frameW, frameH, clearColor);
      if (waitArt) { artFirstFrame = true; artReady(); }
      tele.drawMs += r.ms; tele.drawMax = Math.max(tele.drawMax, r.ms); tele.drawn++; tele.missing += r.missing;
      tele.models += r.models || 0; tele.modelMs += r.modelMs || 0; tele.modelMax = Math.max(tele.modelMax, r.modelMs || 0);
      stats.drawMs = r.ms; stats.mode = "draw";
    } else {
      show(jpegCanvas);
      ctx2d.drawImage(f.bmp, 0, 0, frameW, frameH);
      stats.mode = "video";
    }
    release(shown); shown = f;
    // tap-to-glass: the first frame shown after the server applied an input
    const now = performance.now();
    for (const [s, t] of sentAt) {
      if (s <= f.input) { stats.tap = now - t; sentAt.delete(s); }
    }
    stats.frames++;
    tele.shown++;
    if (tele.lastShown) tele.gapMax = Math.max(tele.gapMax, now - tele.lastShown);
    tele.lastShown = now;
    if (now - stats.last > 1000) {
      const dt = now - stats.last;
      stats.fps = stats.frames * 1000 / dt;
      stats.kb = stats.recv ? stats.bytes / stats.recv / 1024 : 0;
      stats.frames = 0; stats.bytes = 0; stats.recv = 0; stats.last = now;
      if (stats.show) $("stats").textContent =
        (stats.mode === "draw" ? `${stats.fps.toFixed(0)} fps  ${stats.kb.toFixed(1)} KB  drawn here ${stats.drawMs.toFixed(1)} ms\nrtt` :
        `${stats.fps.toFixed(0)} fps  ${stats.kb.toFixed(0)} KB  q${stats.q}\nrtt`) + ` ${stats.rtt.toFixed(0)} ms  buffer ${playout.margin.toFixed(0)} ms\ntap->frame ${stats.tap.toFixed(0)} ms  audio ${audio.ext}`;
    }
  }
  requestAnimationFrame(present);

  // ------------------------------------------------------------------ input
  let down = false, lastMove = 0;
  function point(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  function sendInput(type, p) {
    const s = ++seq;
    sentAt.set(s, performance.now());
    if (sentAt.size > 50) sentAt.delete(sentAt.keys().next().value);
    send({ type, x: +p.x.toFixed(4), y: +p.y.toFixed(4), seq: s });
  }
  for (const c of [jpegCanvas, glCanvas]) {
    c.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      audio.unlock();
      if (down) return;
      down = true;
      try { c.setPointerCapture(e.pointerId); } catch (err) {}
      sendInput("down", point(e));
    });
    c.addEventListener("pointermove", (e) => {
      if (!down) return;
      const now = performance.now();
      if (now - lastMove < 33) return;
      lastMove = now;
      sendInput("move", point(e));
    });
    const up = (e) => { if (!down) return; down = false; sendInput("up", point(e)); };
    c.addEventListener("pointerup", up);
    c.addEventListener("pointercancel", up);
    c.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  // ------------------------------------------------------------------ screens
  function fillOptions(o) {
    const fill = (sel, items) => { sel.innerHTML = ""; for (const it of items) { const op = document.createElement("option"); op.value = it.id; op.textContent = it.name; sel.appendChild(op); } };
    fill($("optDeck"), o.decks); fill($("optOppDeck"), o.decks); fill($("optLocation"), o.locations);
  }
  function showSetup() {
    $("optOpponent").value = setup.friend ? "friend" : "bot";
    $("optDeck").value = setup.deck; $("optOppDeck").value = setup.opponentDeck; $("optLocation").value = setup.location;
    $("optOppDeck").disabled = setup.friend;
  }
  function showState() {
    const b = $("banner");
    let text = "";
    if (state.phase === "waiting") {
      if (state.friend && state.opponent !== "ready") text = state.opponent === "away" ? "Waiting for your friend to open this page" : "Waiting for your friend to tap play";
      else if (state.ready) text = "Get ready!";
    }
    b.textContent = text; b.style.display = text ? "block" : "none";
    $("menuInfo").textContent = state.friend ? "You are player " + (state.side + 1) + ". Your friend opens the same URL on their phone." : "";
    if (state.phase === "over") {
      $("endTitle").textContent = state.result === "win" ? "Victory!" : state.result === "lose" ? "Defeat" : "Draw";
      setTimeout(() => { if (state.phase === "over") $("endScreen").classList.add("on"); }, 400);
    } else {
      $("endScreen").classList.remove("on");
    }
  }
  // the picture: drawn here from draw lists, or video (JPEG) at a quality and frame rate at most
  // (the server's own settings cap both)
  const PICTURES = { draw: { mode: "list", quality: 100, fps: 60 }, high: { mode: "jpeg", quality: 100, fps: 60 },
    medium: { mode: "jpeg", quality: 55, fps: 24 }, low: { mode: "jpeg", quality: 40, fps: 15 } };
  function picture() {
    let p = null;
    try { p = localStorage.getItem("crforge.picture"); } catch (e) {}
    if (!PICTURES[p]) p = hello && hello.render === "jpeg" ? "high" : "draw";
    return p;
  }
  function sendPicture() {
    let p = PICTURES[picture()] || PICTURES.draw;
    if (p.mode === "list" && !canDraw()) p = PICTURES.high;
    send({ type: "picture", mode: p.mode, quality: p.quality, fps: p.fps, models: models3d() === "3d" && !!M && M.ok });
  }
  $("optModels").value = models3d();
  $("optModels").addEventListener("change", () => {
    try { localStorage.setItem("crforge.models", $("optModels").value); } catch (e) {}
    sendPicture();
  });
  $("optPicture").value = picture();
  $("optPicture").addEventListener("change", () => {
    try { localStorage.setItem("crforge.picture", $("optPicture").value); } catch (e) {}
    sendPicture();
  });
  function newBattle() {
    const friend = $("optOpponent").value === "friend";
    send({ type: "new", friend, deck: $("optDeck").value, opponentDeck: $("optOppDeck").value, location: $("optLocation").value });
    $("menu").classList.remove("on"); $("endScreen").classList.remove("on");
  }
  $("optOpponent").addEventListener("change", () => { $("optOppDeck").disabled = $("optOpponent").value === "friend"; });
  $("startBtn").addEventListener("click", () => {
    audio.unlock();
    started = true;
    $("startScreen").classList.remove("on");
    send({ type: "start" });
    if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
  });
  $("menuBtn").addEventListener("click", () => $("menu").classList.add("on"));
  $("closeMenu").addEventListener("click", () => $("menu").classList.remove("on"));
  $("newBtn").addEventListener("click", newBattle);
  $("rematchBtn").addEventListener("click", newBattle);
  $("endMenuBtn").addEventListener("click", () => { $("endScreen").classList.remove("on"); $("menu").classList.add("on"); });
  $("reconnectBtn").addEventListener("click", () => { retry = 0; connect(); });
  $("statsBtn").addEventListener("click", () => { stats.show = !stats.show; $("stats").style.display = stats.show ? "block" : "none"; });
  $("soundBtn").addEventListener("click", () => { audio.unlock(); audio.setMuted(!audio.muted); $("soundBtn").textContent = audio.muted ? "Sound off" : "Sound on"; });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (navigator.wakeLock && started) navigator.wakeLock.request("screen").catch(() => {});
      if (!ws) { retry = 0; connect(); }
    }
  });

  // ------------------------------------------------------------------ audio
  // The game's FMOD events as tools/game-art/crforge_art/audio.py plays them: each layer picks one
  // choice by weight, detuned and attenuated at random; the event's cooldown and instance limit
  // apply; footsteps, wing flaps and voice lines are thinned; a stack of one event is turned down.
  const audio = {
    ctx: null, master: null, musicGain: null, index: null, ext: "ogg", muted: false,
    buffers: new Map(), lastStart: new Map(), voices: new Map(), musicTrack: null,

    unlock() {
      if (!this.ctx) {
        // iOS 16.4+: play as media, so the ring/silent switch does not mute the battle
        try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 8;
        comp.attack.value = 0.003; comp.release.value = 0.15;
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 2.0;
        this.master.connect(comp); comp.connect(this.ctx.destination);
        this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 1; this.musicGain.connect(this.master);
        // iOS: a silent buffer started inside the gesture unlocks output
        const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource();
        s.buffer = b; s.connect(this.ctx.destination); s.start(0);
        this.detectFormat();
      }
      if (this.ctx.state !== "running") this.ctx.resume();
    },
    setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 2.0; },

    async loadIndex() {
      if (this.index) return;
      try { this.index = await (await fetch("/audio/index.json" + q)).json(); } catch (e) { this.index = null; }
      this.detectFormat();
    },
    // Ogg Vorbis where the browser decodes it, else AAC the server transcodes (older iOS Safari)
    async detectFormat() {
      if (!this.ctx || !this.index || this.formatTried) return;
      this.formatTried = true;
      const probe = this.firstSample("ui_battle_general") || this.firstSample("music_jingle_general");
      if (!probe) return;
      try {
        const data = await (await fetch(this.url(probe[0], probe[1], "ogg"))).arrayBuffer();
        await this.decode(data);
        this.ext = "ogg";
      } catch (e) { this.ext = "m4a"; this.buffers.clear(); }
    },
    firstSample(bank) { const b = this.index && this.index.banks[bank]; if (!b) return null; const n = Object.keys(b)[0]; return n ? [bank, n] : null; },
    url(bank, sample, ext) { return "/audio/" + encodeURIComponent(bank) + "/" + encodeURIComponent(sample) + "." + (ext || this.ext) + q; },
    decode(data) { return new Promise((ok, fail) => { const p = this.ctx.decodeAudioData(data, ok, fail); if (p && p.catch) p.catch(fail); }); },
    buffer(bank, sample) {
      const key = bank + "/" + sample + "." + this.ext;
      let p = this.buffers.get(key);
      if (!p) {
        p = fetch(this.url(bank, sample)).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then((d) => this.decode(d));
        p.catch(() => {});
        this.buffers.set(key, p);
      }
      return p;
    },
    key(ref) { const p = ref.replace(/^\/+|\/+$/g, "").split("/"); return p.slice(-2).join("/"); },
    lookup(ref) {
      const key = this.key(ref), ev = this.index.events;
      if (ev[key]) return { key, ev: ev[key], bank: key.split("/")[0] };
      const low = key.toLowerCase().replace(/ /g, "_");
      for (const k in ev) if (k.toLowerCase().replace(/ /g, "_") === low) return { key, ev: ev[k], bank: k.split("/")[0] };
      // audio.py's samples_for: the longest matching suffix of the event's name among the bank's samples
      const [bank, event] = key.split("/");
      const names = Object.keys(this.index.banks[bank] || {});
      if (!names.length || !event) return null;
      const tokens = event.replace(/ /g, "_").split("_");
      for (let i = 0; i < tokens.length; i++) {
        const k = tokens.slice(i).join("_");
        if (k.length < 3) continue;
        const c = names.filter((s) => s === k || s.startsWith(k)).sort();
        if (c.length) return { key, bank, ev: { v: -12, cd: 0.05, mi: 3, st: 64, l: [{ s: 0, n: 0, p: 1, c: c.map((s) => [s, 1, 0, 0, 0, 0, 0, 0, 0]) }] } };
      }
      return null;
    },
    play(ref) {
      if (!this.ctx || !this.index || this.muted || this.ctx.state !== "running") return;
      const found = this.lookup(ref);
      if (!found) return;
      const { key, ev, bank } = found;
      const now = this.ctx.currentTime;
      const footstep = /_(steps|step|wing)$/.test(key);
      let cd = Math.max(ev.cd || 0, 0.03);
      if (footstep) cd = Math.max(cd, 0.3); else if (key.endsWith("_vo")) cd = Math.max(cd, 2.0);
      if (this.lastStart.has(key) && now - this.lastStart.get(key) < cd) return;
      let active = (this.voices.get(key) || []).filter((v) => v.end > now && !v.stopped);
      const thin = Math.max(-6, -2 * active.length) + (footstep ? -4 : 0);
      if (active.length >= (ev.mi || 1e9)) {
        if (ev.st === 0) return;
        const oldest = active.reduce((a, b) => (a.t < b.t ? a : b));
        oldest.stop(now); active = active.filter((v) => v !== oldest);
      }
      const voice = { t: now, end: now, stopped: false, nodes: [], stop(at) { this.stopped = true; for (const n of this.nodes) { try { n.g.gain.setTargetAtTime(0, at, 0.01); n.s.stop(at + 0.05); } catch (e) {} } } };
      for (const layer of ev.l) {
        if (Math.random() > (layer.p == null ? 1 : layer.p)) continue;
        const c = this.pick(layer.c);
        if (!c || !c[0]) continue;
        const [sample, , vol, pitch, rv, rp, d0, d1, loop] = c;
        const semis = pitch + (rp ? (Math.random() - 0.5) * rp : 0);
        const db = (ev.v || 0) + vol + thin - (rv ? Math.random() * rv : 0);
        const delay = d1 > d0 ? d0 + Math.random() * (d1 - d0) : d0;
        const requested = performance.now();
        this.buffer(bank, sample).then((buf) => {
          // a sample that took too long to arrive is dropped rather than played late
          if (performance.now() - requested > 350) return;
          const t0 = Math.max(this.ctx.currentTime, now) + (layer.s || 0) + delay;
          const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
          s.buffer = buf; s.playbackRate.value = Math.pow(2, semis / 12);
          g.gain.value = Math.pow(10, db / 20);
          s.connect(g); g.connect(this.master);
          if (loop && layer.n > buf.duration) { s.loop = true; s.start(t0); s.stop(t0 + layer.n); voice.end = Math.max(voice.end, t0 + layer.n); }
          else { s.start(t0); voice.end = Math.max(voice.end, t0 + buf.duration / s.playbackRate.value); }
          voice.nodes.push({ s, g });
        }, () => {});
      }
      voice.end = now + 0.5;
      const list = (this.voices.get(key) || []).filter((v) => v.end > now);
      list.push(voice); this.voices.set(key, list);
      this.lastStart.set(key, now);
    },
    pick(choices) {
      let total = 0; for (const c of choices) total += Math.max(c[1], 0);
      if (total <= 0) return choices[Math.floor(Math.random() * choices.length)];
      let r = Math.random() * total;
      for (const c of choices) { r -= Math.max(c[1], 0); if (r <= 0) return c; }
      return choices[choices.length - 1];
    },
    // the battle music: a music event's choices looped as a shuffled playlist; null stops it
    music(ref, delay) {
      if (!this.ctx || !this.index) { this.pendingMusic = [ref, delay]; return; }
      const now = this.ctx.currentTime;
      if (this.musicTrack) { this.musicTrack.stop(now); this.musicTrack = null; }
      if (!ref) return;
      const found = this.lookup(ref);
      if (!found || !found.ev.l.length) return;
      const { ev, bank } = found;
      const choices = found.ev.l[0].c.filter((c) => c[0]);
      if (!choices.length) return;
      const order = choices.map((c) => c).sort(() => Math.random() - 0.5);
      const track = { stopped: false, src: null, g: null, stop(at) { this.stopped = true; if (this.g) { this.g.gain.setTargetAtTime(0, at, 0.15); try { this.src.stop(at + 0.6); } catch (e) {} } } };
      this.musicTrack = track;
      let k = 0, at = now + delay;
      const next = () => {
        if (track.stopped) return;
        const c = order[k++ % order.length];
        this.buffer(bank, c[0]).then((buf) => {
          if (track.stopped) return;
          const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
          s.buffer = buf; g.gain.value = Math.pow(10, ((ev.v || 0) + c[2]) / 20);
          s.connect(g); g.connect(this.musicGain);
          const start = Math.max(at, this.ctx.currentTime);
          s.start(start); at = start + buf.duration;
          track.src = s; track.g = g;
          s.onended = next;
        }, () => {});
      };
      next();
    },
  };

  setInterval(() => { if (audio.pendingMusic && audio.ctx && audio.index) { const [r, d] = audio.pendingMusic; audio.pendingMusic = null; audio.music(r, d); } }, 500);

  fit();
  connect();
})();
</script>
</body>
