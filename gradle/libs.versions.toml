# This repository's own versions. They match crforge 15f9aaac's gradle/libs.versions.toml (the
# submodule) where both use a library, so the simulator and the renderer run on the same Jackson;
# check them against the submodule's when you bump it (CONTRIBUTING.md).
[versions]
jackson = "2.23.0"
lombok = "1.18.48"
slf4j = "2.0.20"
junit = "6.1.3"
assertj = "3.27.7"
gdx = "1.14.2"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
